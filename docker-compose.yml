services:
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: minio

    command: server /data --console-address ":9001"

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data

volumes:
  minio_data: